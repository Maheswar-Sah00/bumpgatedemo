name: Bumpgate

# Every Dependabot / Renovate PR: Kane CLI replays .kane/ journeys on main and on the bump.
# Merges only if every journey that passes on main still passes. On a break, Codex migrates
# the code from Kane's evidence and Kane re-verifies; after 3 tries a human takes over.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: bumpgate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      github.event.pull_request.user.login == 'renovate[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'bumpgate')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: Maheswar-Sah00/bumpgate@main
        with:
          lt-username: ${{ secrets.LT_USERNAME }}
          lt-access-key: ${{ secrets.LT_ACCESS_KEY }}
          agent: codex
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
