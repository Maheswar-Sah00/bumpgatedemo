version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The demo gates these three upgrades: zod and react-query break the shop at runtime
    # while the build stays green; clsx is a safe upgrade that should merge on its own.
    allow:
      - dependency-name: zod
      - dependency-name: "@tanstack/react-query"
      - dependency-name: clsx
